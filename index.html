<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学情诊断 · 中小学知识图谱</title>
<meta name="description" content="选一个章节，做几道题，顺着先修关系找到真正的薄弱根因，生成可分享的学习报告。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6e62'/%3E%3Cpath d='M9 21V11h3.2l3.3 6 3.3-6H22v10h-2.6v-5.6l-2.6 4.8h-2.1l-2.6-4.8V21z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="bar"></div>

<div class="wrap">
  <div class="top">
    <div class="brand" id="home"><span class="dot"></span>学情诊断</div>
    <div class="right">
      <button class="linkbtn" id="btn-about">说明</button>
      <button class="linkbtn" id="btn-ac">登录</button>
    </div>
  </div>

  <!-- 加载 -->
  <div class="view on" id="v-load">
    <div class="loading"><div class="spin"></div>正在准备题库…</div>
  </div>

  <!-- 开始 -->
  <div class="view" id="v-home">
    <div class="hero">
      <h1>先找到卡在哪，<br>再决定练什么。</h1>
      <p>选一个章节做几道题。答错会顺着先修关系往回追，直到找到真正不会的那个点。</p>
    </div>

    <div class="sect">
      <div class="lbl">科目</div>
      <div class="subs" id="subs"></div>
    </div>

    <div class="sect">
      <div class="lbl">年级</div>
      <div class="grades" id="grades"></div>
    </div>

    <div class="sect" id="sect-chap" style="display:none">
      <div class="lbl">章节</div>
      <div class="chaps" id="chaps"></div>
    </div>

    <div class="cta">
      <button class="btn" id="btn-start" disabled>开始诊断</button>
      <div class="hint" id="hint">先选科目和年级</div>
    </div>
  </div>

  <!-- 答题 -->
  <div class="view" id="v-quiz">
    <div class="qwrap">
      <div class="qmeta">
        <span id="q-prog">第 1 题</span>
        <span class="chip" id="q-topic"></span>
      </div>
      <div class="qcard">
        <div class="qtopic" id="q-from"></div>
        <div class="qtext" id="q-text"></div>
        <div id="q-input"></div>
        <div class="acts" id="q-acts"></div>
        <div id="q-fb"></div>
      </div>
    </div>
  </div>

  <!-- 报告 -->
  <div class="view" id="v-report">
    <div class="rwrap" id="report"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/engine.js"></script>
<script src="assets/share.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
